name: Build check and deploy

on:
  push:
    branches: [master]
    paths:
      - "zeeklabs-mvp/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [master]
    paths:
      - "zeeklabs-mvp/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeeklabs-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zeeklabs-mvp/package-lock.json
      - run: npm install
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      - run: npx tsc --noEmit
      # Non-blocking: the codebase has pre-existing lint debt unrelated to
      # deployment (react/no-unescaped-entities, no-explicit-any, unused
      # vars). Surfaced here for visibility, not a merge/deploy gate.
      - run: npm run lint
        continue-on-error: true

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # The EC2 box is ARM64 (Graviton t4g.micro) but GitHub's runners are
      # x86_64 - shipping prebuilt artifacts (Prisma's binary query engine
      # especially) would be architecture-mismatched. Instead, the build
      # itself runs on the box via SSM (no SSH - Session Manager only, see
      # docs/AWS-DEPLOYMENT-PLAN-MVP.md §10), same as the target architecture.
      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "set -e",
              "cd /opt/app",
              "git pull origin master",
              "cd zeeklabs-mvp",
              "export PATH=$PATH:/usr/local/bin",
              "npm install",
              "set -a; . ./.env; set +a",
              "npx prisma migrate deploy",
              "npm run build",
              "pm2 reload ecosystem.config.js --update-env"
            ]' \
            --timeout-seconds 1200 \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text)
            if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" ]]; then
              break
            fi
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deploy failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
